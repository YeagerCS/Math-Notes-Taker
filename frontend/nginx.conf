server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS; resolving per request survives backend container restarts (new IP).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Backend container; same origin, so no CORS needed.
  location /api/ {
    set $api http://mathnotes-api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Service worker must never be cached, or updates to it get stuck.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for client-side routes like /notebooks/:id
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
