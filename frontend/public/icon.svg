<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34497a"/>
      <stop offset="1" stop-color="#1f2e4d"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121b2e"/>
      <stop offset="0.5" stop-color="#1d2a45"/>
      <stop offset="1" stop-color="#121b2e"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#efe7d4"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="#f3efe6"/>
  <!-- page block -->
  <rect x="176" y="118" width="190" height="284" rx="14" fill="#fbf8f0"/>
  <!-- cover -->
  <rect x="146" y="106" width="210" height="300" rx="16" fill="url(#board)"/>
  <rect x="146" y="106" width="34" height="300" rx="8" fill="url(#spine)"/>
  <line x1="186" y1="118" x2="186" y2="394" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- elastic band -->
  <rect x="322" y="106" width="12" height="300" fill="#141414"/>
  <!-- label with a hand-drawn integral -->
  <rect x="200" y="158" width="104" height="80" rx="6" fill="url(#label)"/>
  <rect x="207" y="165" width="90" height="66" rx="3" fill="none" stroke="#b9a983" stroke-width="2"/>
  <path d="M262 176 c-8 -6 -16 2 -16 12 l-4 32 c-1 10 -10 14 -16 8" fill="none" stroke="#27395c" stroke-width="5" stroke-linecap="round"/>
</svg>
