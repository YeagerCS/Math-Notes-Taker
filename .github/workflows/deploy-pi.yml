name: Deploy backend to Raspberry Pi

# Manual only: Actions → "Deploy backend to Raspberry Pi" → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: pi-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: check
    # Self-hosted runner on the Raspberry Pi (builds natively for arm64).
    runs-on: [self-hosted, mathnotes]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t mathnotes-api:latest backend
      - name: Restart container
        run: docker compose -p mathnotes -f deploy/docker-compose.yml up -d --remove-orphans
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then exit 0; fi
            sleep 2
          done
          docker compose -p mathnotes -f deploy/docker-compose.yml logs --tail 50
          exit 1
      - name: Prune old images
        if: always()
        run: docker image prune -f
