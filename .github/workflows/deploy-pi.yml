name: Deploy to Raspberry Pi

# Manual only: Actions → "Deploy to Raspberry Pi" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, web]
        default: all

concurrency:
  group: pi-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: check
    # Self-hosted runner on the Raspberry Pi (builds natively for arm64).
    runs-on: [self-hosted, mathnotes]
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        if: env.TARGET == 'all' || env.TARGET == 'api'
        run: docker build -t mathnotes-api:latest backend
      - name: Build web image
        if: env.TARGET == 'all' || env.TARGET == 'web'
        run: docker build -t mathnotes-web:latest frontend
      - name: Restart containers
        run: |
          case "$TARGET" in
            all) services="api web" ;;
            *)   services="$TARGET" ;;
          esac
          docker compose -p mathnotes -f deploy/docker-compose.yml up -d --no-deps $services
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/api/health; then exit 0; fi
            sleep 2
          done
          docker compose -p mathnotes -f deploy/docker-compose.yml logs --tail 50
          exit 1
      - name: Prune old images
        if: always()
        run: docker image prune -f
