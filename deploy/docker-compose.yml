# Runs on the Raspberry Pi. Postgres is the existing instance in k3s (namespace fc26),
# reached through the ClusterIP service `postgres-shared` (see deploy/k8s/postgres-shared.yaml).
# The frontend is NOT hosted here — it lives on GitHub Pages (https://notes.malisi.ch).
services:
  api:
    image: mathnotes-api:latest
    container_name: mathnotes-api
    restart: unless-stopped
    env_file: ${MATHNOTES_ENV_FILE:-/home/silv/mathnotes/.env}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    ports:
      - "3100:3000"
    networks: [default, proxy]

networks:
  # Lets Nginx Proxy Manager forward https://api.malisi.ch to mathnotes-api:3000
  proxy:
    name: nginxnpm_default
    external: true
